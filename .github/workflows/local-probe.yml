name: Local Sources Probe

# Diagnostic for the four local calendars. Runs from a GitHub Actions runner,
# which can reach the sites, and prints what each page actually serves so the
# scrapers get fixed against evidence rather than guesses. Sends nothing,
# deploys nothing.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/feed-problems-ez2jos

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml python-dateutil playwright

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Is Ann Arbor's events API usable without a browser?
        run: python scripts/local_probe.py annarbor-api

      - name: Does the Yodel widget server-render its events?
        if: always()
        run: python scripts/local_probe.py yodel-static

      - name: Can the VBO widget key be resolved over plain HTTP?
        if: always()
        run: python scripts/local_probe.py vbo-key
